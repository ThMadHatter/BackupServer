name: qdrant
schema_version: "1.0"

backup:
  - name: list_collections
    type: http_get
    options:
      url: "{{ qdrant_url | default('http://localhost:6333') }}/collections"
    store_result: collections_resp

  - name: extract_names
    type: json_query
    options:
      data: "{{ collections_resp }}"
      query: "result.collections[].name"
    store_result: collection_names

  - name: create_snapshot
    type: http_post
    options:
      url: "{{ qdrant_url | default('http://localhost:6333') }}/collections/default/snapshots"
    store_result: snapshot_resp

  - name: archive
    type: tar
    options:
      source_dir: "/tmp/snapshots"
      dest_file: "/tmp/qdrant_backup.tar.zst"
    store_result: artifact_path

  - name: upload
    type: rclone_upload
    options:
      local_path: "{{ artifact_path }}"
      remote_name: "{{ infra.rclone_remote.split(':')[0] }}"
      remote_path: "backups/qdrant/{{ timestamp }}/qdrant.tar.zst"

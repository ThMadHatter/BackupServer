name: qdrant
schema_version: "1.0"

backup:
  - name: create_snapshot
    type: http_post
    options:
      url: "{{ qdrant_url | default('http://localhost:6333') }}/collections/default/snapshots"
    store_result: snapshot_resp

  - name: download_snapshot
    type: pct_pull
    options:
      vmid: 105
      source: "/qdrant/storage/collections/default/snapshots/latest.snapshot"
      dest: "/tmp/qdrant_{{ timestamp }}.snapshot"
    store_result: artifact_path

  - name: upload
    type: rclone_upload
    options:
      local_path: "{{ artifact_path }}"
      remote_name: "{{ infra.rclone_remote.split(':')[0] }}"
      remote_path: "backups/qdrant/{{ timestamp }}/qdrant.snapshot"

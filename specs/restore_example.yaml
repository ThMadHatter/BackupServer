name: restore_example
schema_version: "1.0"

restore:
  - name: download_artifact
    type: rclone_download
    options:
      remote_name: "{{ infra.rclone_remote.split(':')[0] }}"
      remote_path: "{{ artifact_remote_path }}"
      local_path: "/tmp/restore.tar.zst"
    store_result: local_artifact

  - name: verify_checksum
    type: checksum
    options:
      file_path: "{{ local_artifact }}"
    store_result: current_checksum

  - name: check_integrity
    type: template
    options:
      template: "Checksum valid: {{ current_checksum == expected_checksum }}"
